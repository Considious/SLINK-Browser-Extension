<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLINK private API key settings</title>
<style>
  :root{color-scheme:light dark}*{box-sizing:border-box}body{font:13px/1.35 system-ui;margin:8px;background:Canvas;color:CanvasText}
  h1{font-size:1.05rem;margin:0 0 6px}p{margin:5px 0}form{display:grid;gap:6px}
  input[type=password]{width:100%;font:inherit;border:1px solid GrayText;border-radius:4px;padding:4px}
  .actions{display:flex;gap:5px;flex-wrap:wrap}button{font:inherit;padding:4px 7px}
  :focus-visible{outline:2px solid Highlight;outline-offset:2px}
</style>
<h1>Private SLINK key editor</h1><p>Keys are entered on an extension page, separate from Torn.</p>
<form method="post">
  <label>Torn API key <input type="password" name="tornKey" autocomplete="new-password" maxlength="128"></label>
  <label>FFScouter key <input type="password" name="ffKey" autocomplete="new-password" maxlength="128"></label>
  <label><input type="checkbox" name="efficiency"> Enable Efficiency alerts</label>
  <label><input type="checkbox" name="war"> Enable War</label>
  <label><input type="checkbox" name="leveling"> Enable Leveling</label>
  <div data-terms>Loading SLINK terms…</div>
  <label><input type="checkbox" name="acceptTerms" disabled> I accept the current terms and disclosures.</label>
  <div class="actions"><button disabled>Save &amp; verify</button><button type="button" data-remove disabled>Remove saved keys</button></div>
  <label data-confirm hidden>Type REMOVE to confirm <input type="text" name="confirmation" autocomplete="off"></label>
  <p role="status"></p>
</form>
<script src="../core/runtime.js"></script><script src="../core/errors.js"></script><script src="../core/format.js"></script><script src="../core/messaging.js"></script><script src="credentials.js"></script>
</html>
